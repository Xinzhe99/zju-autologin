name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag
        run: |
          python - <<'EOF'
          import os, re, sys
          src = open('zju_autologin/__init__.py', encoding='utf-8').read()
          v = re.search(r'__version__ = "([^"]+)"', src).group(1)
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          if v != tag:
              print(f'版本号 {v} 与 tag {tag} 不一致 — 请先更新 __init__.py')
              sys.exit(1)
          print(f'version {v} == tag {tag} OK')
          EOF

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe (portable)
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name ZJUAutoLogin
          --icon resources/zju.ico
          --add-data "resources;resources"
          --add-data "zju_autologin/i18n;zju_autologin/i18n"
          main.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:APP_VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          if ($env:APP_VERSION -eq '') { $env:APP_VERSION = '0.0.0-dev' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss "/DAppVersion=$env:APP_VERSION"

      - name: Zip portable
        shell: pwsh
        run: |
          $env:APP_VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          if ($env:APP_VERSION -eq '') { $env:APP_VERSION = '0.0.0-dev' }
          Compress-Archive -Path dist/ZJUAutoLogin.exe -DestinationPath "dist/ZJUAutoLogin-$env:APP_VERSION-windows-portable.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ZJUAutoLogin-*-windows-setup.exe
            dist/ZJUAutoLogin-*-windows-portable.zip

  build-macos:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build .app
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ZJUAutoLogin
          --icon resources/zju.icns
          --add-data "resources:resources"
          --add-data "zju_autologin/i18n:zju_autologin/i18n"
          main.py

      - name: Package dmg and zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "" ] && VERSION="0.0.0-dev"
          hdiutil create -volname "ZJU AutoLogin" -srcfolder dist/ZJUAutoLogin.app -ov -format UDZO "dist/ZJUAutoLogin-${VERSION}-macos.dmg"
          cd dist && zip -r -y "ZJUAutoLogin-${VERSION}-macos-portable.zip" ZJUAutoLogin.app && cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ZJUAutoLogin-*-macos.dmg
            dist/ZJUAutoLogin-*-macos-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ZJU AutoLogin $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
